name: Deploy til Google Play

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Bygg og submit Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('package.json') }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Installer avhengigheter
        run: npm ci

      - name: Skriv Google service account-nøkkel
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > google-service-account.json

      # versionCode må være høyere enn alt som er lastet opp før – også bygg fra
      # EAS (`npm run build:android`), som nummererer uavhengig av denne
      # workflowen. Kjøring #27 feilet fordi 127 allerede var brukt. Spør Play
      # om høyeste kode på alle spor og gå forbi den.
      - name: Sett versionCode
        run: |
          MAX_PLAY=0
          for TRACK in internal alpha beta production; do
            CODES=$(bundle exec fastlane run google_play_track_version_codes \
              package_name:com.nguyenchu.melkogbrod json_key:google-service-account.json track:$TRACK 2>/dev/null \
              | grep -oE 'Result: \[[0-9, ]*\]' | grep -oE '[0-9]+' || true)
            echo "Play-spor $TRACK: ${CODES:-ingen}"
            for C in $CODES; do if [ "$C" -gt "$MAX_PLAY" ]; then MAX_PLAY=$C; fi; done
          done
          VERSION_CODE=$(( ${{ github.run_number }} + 100 ))
          if [ "$VERSION_CODE" -le "$MAX_PLAY" ]; then VERSION_CODE=$(( MAX_PLAY + 1 )); fi
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.android.versionCode = ${VERSION_CODE};
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
            console.log('versionCode satt til ${VERSION_CODE}');
          "

      - name: Generer Android-prosjekt
        run: npx expo prebuild --platform android --no-install
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Legg til signing-config i build.gradle
        run: |
          echo '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > android/app/release.keystore
          python3 - <<'EOF'
          import re

          with open('android/app/build.gradle', 'r') as f:
              content = f.read()

          release_config = """
                  release {
                      storeFile file("release.keystore")
                      storeType "JKS"
                      storePassword System.getenv("ANDROID_STORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }"""

          content = re.sub(r'(signingConfigs \{)', r'\1' + release_config, content)
          content = content.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')

          with open('android/app/build.gradle', 'w') as f:
              f.write(content)

          print("Signing config lagt til")
          EOF

      - name: Bygg release AAB
        run: ./gradlew bundleRelease
        working-directory: android
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Submit til Google Play (internal)
        run: bundle exec fastlane supply --aab android/app/build/outputs/bundle/release/app-release.aab --track internal --json_key google-service-account.json --package_name com.nguyenchu.melkogbrod --skip_upload_metadata --skip_upload_images --skip_upload_screenshots
