name: find-deals

on:
  schedule:
    # 06:05 og 18:05 UTC ≈ 07/19 vinter, 08/20 sommer (Oslo)
    - cron: '5 6,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Kjøremodus'
        type: choice
        options: [incremental, full]
        default: incremental

concurrency:
  group: find-deals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FIND_DEALS_MODE: ${{ inputs.mode || 'incremental' }}
      PRODUCT_SAMPLE_SIZE: '1500'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/deal-finder/requirements.txt

      - name: Install deps
        run: pip install -r scripts/deal-finder/requirements.txt

      - name: Restore deals.db cache
        id: restore-db
        uses: actions/cache/restore@v4
        with:
          path: scripts/deal-finder/deals.db
          key: deals-db-${{ github.run_id }}
          restore-keys: |
            deals-db-

      - name: Run find_deals
        run: python scripts/deal-finder/find_deals.py

      - name: Save deals.db cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: scripts/deal-finder/deals.db
          key: deals-db-${{ github.run_id }}
