name: CI

# Tester, typesjekk og lint på hver PR og hver push til main. Testene kjører
# også på Windows, der appen utvikles, så feil med stier og linjeskift som
# bare viser seg der blir fanget før merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Typesjekk
        if: matrix.os == 'ubuntu-latest'
        run: npx tsc --noEmit

      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npx eslint .
