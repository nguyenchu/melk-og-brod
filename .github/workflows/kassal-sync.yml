name: kassal-sync

on:
  # Nattlig kl. 04:05 norsk tid (02:05 UTC). Uten denne blir products.json
  # liggende urørt og appen viser gamle priser. Repoet er offentlig, så
  # Actions-minutter er gratis – ingen grunn til å spare på kjøringene.
  schedule:
    - cron: '5 2 * * *'
  workflow_dispatch:

concurrency:
  group: kassal-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sync-avhengigheter
        working-directory: scripts/kassal-sync
        run: npm install

      - name: Kjør Kassal-sync → products.json
        working-directory: scripts/kassal-sync
        env:
          KASSAL_API_TOKEN: ${{ secrets.KASSAL_API_TOKEN }}
          OUT_DIR: out
        run: npx tsx sync.ts

      # Vakt mot å publisere en ødelagt katalog over en fungerende én.
      # Syncen exit-er allerede non-zero ved total feil, men en delvis kjøring
      # (Kassal-timeout, tomt svar) kan skrive en tynn fil som ellers ville
      # blitt rsync-et rett over produksjonsdataene.
      - name: Sjekk at katalogen er brukbar
        working-directory: scripts/kassal-sync
        run: |
          node -e '
            const fs = require("fs");
            const { computed_at, products } = JSON.parse(fs.readFileSync("out/products.json", "utf8"));
            const n = products?.length ?? 0;
            if (n < 500) {
              console.error(`FEIL: bare ${n} produkter – nekter å publisere en tynn katalog`);
              process.exit(1);
            }
            const ageHours = (Date.now() - Date.parse(computed_at)) / 3.6e6;
            if (!(ageHours < 6)) {
              console.error(`FEIL: computed_at er ${ageHours.toFixed(1)} t gammel – fila ble ikke regenerert`);
              process.exit(1);
            }
            console.log(`OK: ${n} produkter, computed_at ${computed_at}`);
          '

      # Last opp products.json dit appen leser den (EXPO_PUBLIC_DATA_URL).
      # Krever fire secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH.
      # (Alternativ uten server: commit fila til en data-branch og server via CDN.)
      - name: Last opp til server (rsync over SSH)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -avz scripts/kassal-sync/out/products.json \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/products.json"
